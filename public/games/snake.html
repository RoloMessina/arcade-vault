<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#f5ff00}
  body{display:grid;place-items:center}
  canvas{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const COLS = 20, ROWS = 15, S = 20;
const P = new URLSearchParams(location.search);
const MAXLIVES = +P.get("vidas") || 3;
let snake, dir, next, food, score, lives, level, timer, paused, started, over;

const send = (m) => parent.postMessage(m, "*");
const state = () => send({ type: "arcade:state", score, lives, level });

function reset() {
  snake = [{x:8,y:7},{x:7,y:7},{x:6,y:7}]; dir = next = {x:1,y:0}; placeFood();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function init() { score=0; lives=MAXLIVES; level=1; paused=false; started=false; over=false; reset(); state(); loop(); draw(); }
function loop() { clearInterval(timer); timer = setInterval(tick, Math.max(55, 150 - (level-1)*14)); }

function tick() {
  if (!started || paused || over) return;
  dir = next;
  const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)) {
    lives--; started=false;
    if (lives<=0) { over=true; send({type:"arcade:gameover", score}); } else reset();
    state(); draw(); return;
  }
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) {
    score += 10;
    const nl = Math.floor(score/50)+1;
    if (nl!==level) { level=nl; loop(); }
    placeFood(); state();
  } else snake.pop();
  draw();
}

function draw() {
  ctx.fillStyle="#05050a"; ctx.fillRect(0,0,400,300);
  ctx.strokeStyle="rgba(0,245,255,.08)";
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,300);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(400,y*S);ctx.stroke();}
  ctx.shadowBlur=12;
  ctx.fillStyle=ctx.shadowColor="#ff006e"; ctx.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);
  snake.forEach((s,i)=>{ ctx.fillStyle=ctx.shadowColor= i?"#00f5ff":"#f5ff00"; ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2); });
  ctx.shadowBlur=0;
  if (!started && !over) {
    ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,110,400,70);
    ctx.fillStyle="#f5ff00"; ctx.font="bold 18px 'Courier New'"; ctx.textAlign="center";
    ctx.fillText("PULSA UNA FLECHA PARA EMPEZAR", 200, 150);
  }
}

function turn(d) {
  if (over) return;
  if (d.x === -dir.x && d.y === -dir.y && snake.length>1) return;
  next = d; started = true; draw();
}
const KEYS = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener("keydown", e => { const k = KEYS[e.key]; if (k) { e.preventDefault(); turn({x:k[0],y:k[1]}); } });

let t0;
cv.addEventListener("touchstart", e => { t0 = e.touches[0]; }, {passive:true});
cv.addEventListener("touchend", e => {
  if (!t0) return; const t = e.changedTouches[0], dx = t.clientX-t0.clientX, dy = t.clientY-t0.clientY;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
  Math.abs(dx)>Math.abs(dy) ? turn({x:Math.sign(dx),y:0}) : turn({x:0,y:Math.sign(dy)});
});

addEventListener("message", e => {
  if (e.data?.type==="arcade:pause") paused=true;
  if (e.data?.type==="arcade:resume") paused=false;
});
init();
</script>
</body>
</html>
