<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serpentina</title>
<style>
  html,body{margin:0;height:100%;background:#05050a;overflow:hidden;font-family:"Courier New",monospace}
  body{display:grid;place-items:center}
  canvas{width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const COLS = 20, ROWS = 15, S = 40;
const MAXLIVES = +new URLSearchParams(location.search).get("vidas") || 3;

/* Sprites de frutas (fila pixel-art de fruits.png, 3790x442). Fuente: references/source-asses/snake-assets */
const FRUITS = [
  [34,110],[186,150],[378,110],[540,130],[712,130],[894,110],[1066,110],[1228,130],[1400,130],[1582,110],
  [1734,150],[1906,150],[2068,170],[2250,140],[2432,130],[2604,130],[2786,110],[2948,130],[3110,150],[3302,110],
  [3454,150],[3637,130],
].map(([x, w]) => ({ x, y: 136, w, h: 160 }));
const sheet = new Image();
let sheetOk = false;
sheet.onload = () => { sheetOk = true; draw(); };
sheet.src = "/games/assets/serpentina/fruits.png";

let snake, dir, next, food, score, lives, level, timer, paused = false, started = false, over = false, lastSent = "";

const send = (m) => parent.postMessage(m, "*");
function state() {
  const k = score + "|" + lives + "|" + level;
  if (k === lastSent) return;
  lastSent = k;
  send({ type: "arcade:state", score, lives, level });
}

function reset() {
  snake = [{x:8,y:7},{x:7,y:7},{x:6,y:7}];
  dir = next = {x:1,y:0};
  placeFood();
}
function placeFood() {
  let f;
  do { f = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some((s) => s.x === f.x && s.y === f.y));
  food = { ...f, fruit: FRUITS[Math.floor(Math.random()*FRUITS.length)] };
}
function init() {
  score = 0; lives = MAXLIVES; level = 1;
  reset(); state(); loop(); draw();
}
function loop() {
  clearInterval(timer);
  timer = setInterval(tick, Math.max(55, 150 - (level - 1) * 14));
}

function tick() {
  if (!started || paused || over) return;
  dir = next;
  const h = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS || snake.some((s) => s.x === h.x && s.y === h.y)) {
    lives--; started = false;
    if (lives <= 0) { over = true; clearInterval(timer); send({ type: "arcade:gameover", score }); }
    else reset();
    state(); draw(); return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score += 10;
    const nl = Math.floor(score / 50) + 1;
    if (nl !== level) { level = nl; loop(); }
    placeFood(); state();
  } else snake.pop();
  draw();
}

/* ---------- dibujo ---------- */
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function drawFood() {
  const px = food.x * S, py = food.y * S, f = food.fruit;
  if (!sheetOk) { ctx.fillStyle = "#ff006e"; rrect(px + 8, py + 8, S - 16, S - 16, 6); return; }
  const dh = S + 4, dw = dh * f.w / f.h;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheet, f.x, f.y, f.w, f.h, px + (S - dw) / 2, py - 2, dw, dh);
}
function drawSnake() {
  const n = snake.length;
  for (let i = n - 1; i >= 0; i--) {
    const s = snake[i], t = n > 1 ? i / (n - 1) : 0;
    if (i === 0) {
      ctx.save(); ctx.shadowColor = "#00ff88"; ctx.shadowBlur = 16;
      ctx.fillStyle = "#00ff88"; rrect(s.x * S + 1, s.y * S + 1, S - 2, S - 2, 12);
      ctx.restore();
      // ojos según la dirección
      const cx = s.x * S + S / 2, cy = s.y * S + S / 2, d = started ? dir : next;
      const px = -d.y, py = d.x;       // perpendicular
      ctx.fillStyle = "#05050a";
      for (const k of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(cx + d.x * 7 + px * 8 * k, cy + d.y * 7 + py * 8 * k, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = "rgb(0," + Math.round(245 - 90 * t) + "," + Math.round(136 + 109 * t) + ")";
      rrect(s.x * S + 3, s.y * S + 3, S - 6, S - 6, 9);
    }
  }
}
function banner(lines, color) {
  ctx.fillStyle = "rgba(5,5,10,0.72)"; ctx.fillRect(0, 90, 800, 120);
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  lines.forEach((l, i) => { ctx.font = "bold " + l[1] + "px 'Courier New', monospace"; ctx.fillText(l[0], 400, 150 + (i - (lines.length - 1) / 2) * 40); });
  ctx.restore();
}
function draw() {
  ctx.fillStyle = "#05050a"; ctx.fillRect(0, 0, 800, 600);
  ctx.strokeStyle = "rgba(0,245,255,0.07)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * S, 0); ctx.lineTo(x * S, 600); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * S); ctx.lineTo(800, y * S); }
  ctx.stroke();
  drawFood();
  drawSnake();
  if (over) banner([["GAME OVER", 48]], "#ff006e");
  else if (paused) banner([["PAUSA", 48]], "#f5ff00");
  else if (!started) banner(lives === MAXLIVES && score === 0
    ? [["PULSA UNA FLECHA", 30], ["PARA EMPEZAR", 30]]
    : [["PULSA UNA FLECHA", 26], ["PARA CONTINUAR", 26]], "#f5ff00");
}

/* ---------- entrada ---------- */
function turn(d) {
  if (over || paused) return;
  if (d.x === -dir.x && d.y === -dir.y && snake.length > 1) return;
  next = d; started = true; draw();
}
const KEYS = {
  ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1],
  ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0],
};
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (!started && !over && !paused) { started = true; draw(); } return; }
  const k = KEYS[e.code];
  if (k) { e.preventDefault(); turn({ x: k[0], y: k[1] }); }
});

let t0;
cv.addEventListener("touchstart", (e) => { t0 = e.touches[0]; }, { passive: true });
cv.addEventListener("touchend", (e) => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  Math.abs(dx) > Math.abs(dy) ? turn({ x: Math.sign(dx), y: 0 }) : turn({ x: 0, y: Math.sign(dy) });
});

addEventListener("message", (e) => {
  if (e.data?.type === "arcade:pause") { paused = true; draw(); }
  if (e.data?.type === "arcade:resume") { paused = false; draw(); }
});
init();
</script>
</body>
</html>
