<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocas</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace}
  body{display:grid;place-items:center}
  canvas{width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
'use strict';

const canvas = document.getElementById( 'c' );
const ctx = canvas.getContext( '2d' );
const W = 800;
const H = 600;

// ── Input ─────────────────────────────────────────────────────────────────────

const keys = {};
const justPressed = {};

// Teclas del juego (e.code). Flechas y WASD son equivalentes.
const GAME_KEYS = [ 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'Space' ];
const LEFT = [ 'ArrowLeft', 'KeyA' ];
const RIGHT = [ 'ArrowRight', 'KeyD' ];
const UP = [ 'ArrowUp', 'KeyW' ];
const held = codes => codes.some( c => keys[ c ] );

window.addEventListener( 'keydown', e => {
  if ( !GAME_KEYS.includes( e.code ) ) return;
  e.preventDefault();   // evita el scroll de la página con flechas y Espacio
  if ( !keys[ e.code ] ) justPressed[ e.code ] = true;
  keys[ e.code ] = true;
} );
window.addEventListener( 'keyup', e => { keys[ e.code ] = false; } );

function clearKeys() {
  for ( const k in keys ) keys[ k ] = false;
  for ( const k in justPressed ) justPressed[ k ] = false;
}
window.addEventListener( 'blur', clearKeys );
document.addEventListener( 'visibilitychange', () => { if ( document.hidden ) clearKeys(); } );

function pressed( code ) {
  const val = justPressed[ code ];
  justPressed[ code ] = false;
  return val;
}

// ── Utils ─────────────────────────────────────────────────────────────────────
const wrap = ( v, max ) => ( ( v % max ) + max ) % max;
const dist = ( a, b ) => Math.hypot( a.x - b.x, a.y - b.y );
const rand = ( min, max ) => min + Math.random() * ( max - min );
const randInt = ( min, max ) => Math.floor( rand( min, max + 1 ) );

// ── Protocolo con el portal ───────────────────────────────────────────────────
// juego → portal: arcade:state {score, lives, level} | arcade:gameover {score}
// portal → juego: arcade:pause | arcade:resume
const MAXLIVES = +new URLSearchParams( location.search ).get( 'vidas' ) || 3;
const send = m => parent.postMessage( m, '*' );

let paused = false;
let lastSent = '';
let gameoverSent = false;

// Solo envía cuando cambia puntuación, vidas o nivel
function sendState() {
  const key = `${ score }|${ lives }|${ level }`;
  if ( key === lastSent ) return;
  lastSent = key;
  send( { type: 'arcade:state', score, lives, level } );
}

window.addEventListener( 'message', e => {
  if ( e.source !== parent ) return;
  if ( e.data?.type === 'arcade:pause' ) { paused = true; clearKeys(); }
  if ( e.data?.type === 'arcade:resume' ) paused = false;
} );

// ── Constants ─────────────────────────────────────────────────────────────────
const POWERUP_DROP_CHANCE = 0.15;
const POWERUP_DURATION = 5;
const POWERUP_TTL = 12;
const TRIPLE_SPREAD = 0.18;

// Paleta del portal
const BG = '#05050a';
const YELLOW = '#f5ff00';   // nave y títulos (acento del juego)
const CYAN = '#00f5ff';     // asteroides y partículas
const MAGENTA = '#ff006e';  // power-up y propulsor
const WHITE = '#ffffff';    // balas
const FONT = "'Courier New', monospace";

// Glow neón solo en nave, balas y power-up (las partículas no lo llevan: coste)
const glow = ( color, blur = 12 ) => { ctx.shadowColor = color; ctx.shadowBlur = blur; };
const noGlow = () => { ctx.shadowBlur = 0; };

// ── Bullet ────────────────────────────────────────────────────────────────────
class Bullet {
  constructor( x, y, angle ) {
    this.x = x;
    this.y = y;
    const SPEED = 520;
    this.vx = Math.cos( angle ) * SPEED;
    this.vy = Math.sin( angle ) * SPEED;
    this.ttl = 1.1;
    this.radius = 2;
    this.dead = false;
  }

  update( dt ) {
    this.x = wrap( this.x + this.vx * dt, W );
    this.y = wrap( this.y + this.vy * dt, H );
    this.ttl -= dt;
    if ( this.ttl <= 0 ) this.dead = true;
  }

  draw() {
    ctx.fillStyle = WHITE;
    glow( WHITE, 10 );
    ctx.beginPath();
    ctx.arc( this.x, this.y, this.radius, 0, Math.PI * 2 );
    ctx.fill();
    noGlow();
  }
}

// ── Asteroid ──────────────────────────────────────────────────────────────────
const RADII = [ 0, 16, 30, 50 ];   // por tamaño 1, 2, 3
const SPEEDS = [ 0, 85, 55, 32 ];   // velocidad base por tamaño
const POINTS = [ 0, 100, 50, 20 ];  // puntos por tamaño

class Asteroid {
  constructor( x, y, size = 3 ) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.radius = RADII[ size ];
    this.dead = false;

    const angle = rand( 0, Math.PI * 2 );
    const speed = SPEEDS[ size ] + rand( -15, 15 );
    this.vx = Math.cos( angle ) * speed;
    this.vy = Math.sin( angle ) * speed;
    this.rotSpeed = rand( -1.2, 1.2 );
    this.rot = rand( 0, Math.PI * 2 );

    // Polígono irregular
    const n = randInt( 8, 13 );
    this.verts = [];
    for ( let i = 0; i < n; i++ ) {
      const a = ( i / n ) * Math.PI * 2;
      const r = this.radius * rand( 0.6, 1.0 );
      this.verts.push( [ Math.cos( a ) * r, Math.sin( a ) * r ] );
    }
  }

  update( dt ) {
    this.x = wrap( this.x + this.vx * dt, W );
    this.y = wrap( this.y + this.vy * dt, H );
    this.rot += this.rotSpeed * dt;
  }

  split() {
    if ( this.size <= 1 ) return [];
    return [
      new Asteroid( this.x, this.y, this.size - 1 ),
      new Asteroid( this.x, this.y, this.size - 1 ),
    ];
  }

  draw() {
    ctx.save();
    ctx.translate( this.x, this.y );
    ctx.rotate( this.rot );
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo( this.verts[ 0 ][ 0 ], this.verts[ 0 ][ 1 ] );
    for ( let i = 1; i < this.verts.length; i++ )
      ctx.lineTo( this.verts[ i ][ 0 ], this.verts[ i ][ 1 ] );
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

// ── PowerUp ───────────────────────────────────────────────────────────────────
class PowerUp {
  constructor( x, y ) {
    this.x = x;
    this.y = y;
    const angle = rand( 0, Math.PI * 2 );
    const speed = rand( 20, 40 );
    this.vx = Math.cos( angle ) * speed;
    this.vy = Math.sin( angle ) * speed;
    this.radius = 12;
    this.ttl = POWERUP_TTL;
    this.dead = false;
  }

  update( dt ) {
    this.x = wrap( this.x + this.vx * dt, W );
    this.y = wrap( this.y + this.vy * dt, H );
    this.ttl -= dt;
    if ( this.ttl <= 0 ) this.dead = true;
  }

  draw() {
    if ( this.ttl < 2 && Math.floor( this.ttl * 8 ) % 2 === 0 ) return;
    const pulse = 0.85 + Math.sin( performance.now() / 150 ) * 0.15;
    ctx.save();
    ctx.translate( this.x, this.y );
    ctx.rotate( Math.PI / 4 );
    ctx.strokeStyle = MAGENTA;
    ctx.lineWidth = 2;
    glow( MAGENTA, 12 );
    const r = this.radius * pulse;
    ctx.strokeRect( -r, -r, r * 2, r * 2 );
    ctx.restore();
    ctx.fillStyle = MAGENTA;
    ctx.font = `bold 12px ${ FONT }`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText( '3x', this.x, this.y );
    noGlow();
  }
}

// ── Ship ──────────────────────────────────────────────────────────────────────
class Ship {
  constructor() {
    this.tripleShot = 0;
    this.reset();
  }

  reset() {
    this.x = W / 2;
    this.y = H / 2;
    this.angle = -Math.PI / 2;
    this.vx = 0;
    this.vy = 0;
    this.radius = 12;
    this.thrusting = false;
    this.invincible = 3;
    this.shootCooldown = 0;
    this.dead = false;
  }

  update( dt ) {
    if ( this.dead ) return;
    if ( this.invincible > 0 ) this.invincible -= dt;
    if ( this.shootCooldown > 0 ) this.shootCooldown -= dt;
    if ( this.tripleShot > 0 ) this.tripleShot -= dt;

    const ROT = 3.5;   // rad/s
    const THRUST = 260;  // px/s²
    const DRAG = 0.987;  // factor por cada 1/60 s

    if ( held( LEFT ) ) this.angle -= ROT * dt;
    if ( held( RIGHT ) ) this.angle += ROT * dt;

    this.thrusting = held( UP );
    if ( this.thrusting ) {
      this.vx += Math.cos( this.angle ) * THRUST * dt;
      this.vy += Math.sin( this.angle ) * THRUST * dt;
    }

    // Rozamiento independiente de la tasa de refresco: DRAG era "por fotograma a 60 Hz"
    const drag = Math.pow( DRAG, dt * 60 );
    this.vx *= drag;
    this.vy *= drag;
    this.x = wrap( this.x + this.vx * dt, W );
    this.y = wrap( this.y + this.vy * dt, H );
  }

  tryShoot() {
    if ( this.shootCooldown > 0 || this.dead ) return [];
    this.shootCooldown = 0.2;
    const NOSE = 21;
    const ox = this.x + Math.cos( this.angle ) * NOSE;
    const oy = this.y + Math.sin( this.angle ) * NOSE;
    if ( this.tripleShot > 0 ) {
      return [
        new Bullet( ox, oy, this.angle - TRIPLE_SPREAD ),
        new Bullet( ox, oy, this.angle ),
        new Bullet( ox, oy, this.angle + TRIPLE_SPREAD ),
      ];
    }
    return [ new Bullet( ox, oy, this.angle ) ];
  }

  draw() {
    if ( this.dead ) return;
    // Parpadeo durante invencibilidad de reaparición
    if ( this.invincible > 0 && Math.floor( this.invincible * 8 ) % 2 === 0 ) return;

    ctx.save();
    ctx.translate( this.x, this.y );
    ctx.rotate( this.angle );
    ctx.strokeStyle = YELLOW;
    glow( YELLOW, 12 );
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';

    // Silueta clásica: triángulo con muesca trasera
    ctx.beginPath();
    ctx.moveTo( 20, 0 );   // nariz
    ctx.lineTo( -12, -9 );   // ala izquierda
    ctx.lineTo( -7, 0 );   // muesca trasera
    ctx.lineTo( -12, 9 );   // ala derecha
    ctx.closePath();
    ctx.stroke();

    // Llama del propulsor
    if ( this.thrusting && Math.random() > 0.35 ) {
      ctx.beginPath();
      ctx.moveTo( -8, -4 );
      ctx.lineTo( -8 - rand( 6, 14 ), 0 );
      ctx.lineTo( -8, 4 );
      ctx.strokeStyle = MAGENTA;
      glow( MAGENTA, 12 );
      ctx.stroke();
    }

    noGlow();
    ctx.restore();
  }
}

// ── Partículas (explosión) ────────────────────────────────────────────────────
class Particle {
  constructor( x, y ) {
    this.x = x;
    this.y = y;
    const angle = rand( 0, Math.PI * 2 );
    const speed = rand( 30, 130 );
    this.vx = Math.cos( angle ) * speed;
    this.vy = Math.sin( angle ) * speed;
    this.life = rand( 0.4, 1.1 );
    this.ttl = this.life;
    this.dead = false;
  }

  update( dt ) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.ttl -= dt;
    if ( this.ttl <= 0 ) this.dead = true;
  }

  draw() {
    const alpha = this.ttl / this.life;
    ctx.strokeStyle = `rgba(0,245,255,${ alpha.toFixed( 2 ) })`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo( this.x, this.y );
    ctx.lineTo( this.x - this.vx * 0.05, this.y - this.vy * 0.05 );
    ctx.stroke();
  }
}

// ── Estado del juego ──────────────────────────────────────────────────────────
let ship, bullets, asteroids, particles, powerUps;
let score, lives, level;
let state;      // 'ready' | 'playing' | 'dead' | 'gameover'
let deadTimer;
let powerUpSpawned;
let killsSinceSpawn;

function spawnAsteroids( count ) {
  const SAFE_DIST = 130;
  for ( let i = 0; i < count; i++ ) {
    let x, y;
    do {
      x = rand( 0, W );
      y = rand( 0, H );
    } while ( Math.hypot( x - W / 2, y - H / 2 ) < SAFE_DIST );
    asteroids.push( new Asteroid( x, y, 3 ) );
  }
}

function initGame() {
  ship = new Ship();
  bullets = [];
  asteroids = [];
  particles = [];
  powerUps = [];
  powerUpSpawned = false;
  killsSinceSpawn = 0;
  score = 0;
  lives = MAXLIVES;
  level = 1;
  gameoverSent = false;
  lastSent = '';
  state = 'ready';
  ship.invincible = 0;   // la invencibilidad inicial empieza al arrancar
  spawnAsteroids( 4 );
}

function nextLevel() {
  level++;
  bullets = [];
  particles = [];
  powerUps = [];
  powerUpSpawned = false;
  killsSinceSpawn = 0;
  ship.reset();
  spawnAsteroids( 3 + level );
}

function explode( x, y, count = 8 ) {
  for ( let i = 0; i < count; i++ ) particles.push( new Particle( x, y ) );
}

function killShip() {
  explode( ship.x, ship.y, 14 );
  ship.dead = true;
  lives--;
  if ( lives <= 0 ) {
    state = 'gameover';
    sendState();   // vidas a 0 antes del fin de partida
    if ( !gameoverSent ) {
      gameoverSent = true;
      send( { type: 'arcade:gameover', score } );
    }
  } else {
    state = 'dead';
    deadTimer = 2;
  }
}

// ── Update ────────────────────────────────────────────────────────────────────
function update( dt ) {
  if ( state === 'ready' ) {
    // Pantalla de inicio: los asteroides flotan sin colisionar; Espacio arranca (sin disparar)
    asteroids.forEach( a => a.update( dt ) );
    if ( pressed( 'Space' ) ) {
      state = 'playing';
      ship.invincible = 3;
    }
    return;
  }

  if ( state === 'gameover' ) {
    // Sin reinicio interno: lo gestiona el portal recargando el iframe
    particles.forEach( p => p.update( dt ) );
    particles = particles.filter( p => !p.dead );
    return;
  }

  if ( state === 'dead' ) {
    deadTimer -= dt;
    particles.forEach( p => p.update( dt ) );
    particles = particles.filter( p => !p.dead );
    asteroids.forEach( a => a.update( dt ) );
    if ( deadTimer <= 0 ) { state = 'playing'; ship.reset(); }
    return;
  }

  // Disparar
  if ( pressed( 'Space' ) ) {
    bullets.push( ...ship.tryShoot() );
  }

  ship.update( dt );
  bullets.forEach( b => b.update( dt ) );
  asteroids.forEach( a => a.update( dt ) );
  particles.forEach( p => p.update( dt ) );
  powerUps.forEach( p => p.update( dt ) );

  bullets = bullets.filter( b => !b.dead );
  particles = particles.filter( p => !p.dead );
  powerUps = powerUps.filter( p => !p.dead );

  for ( const p of powerUps ) {
    if ( !p.dead && dist( ship, p ) < ship.radius + p.radius ) {
      p.dead = true;
      ship.tripleShot = POWERUP_DURATION;
    }
  }

  // Bala vs asteroide
  const newAsteroids = [];
  for ( const b of bullets ) {
    for ( const a of asteroids ) {
      if ( !a.dead && !b.dead && dist( b, a ) < a.radius ) {
        b.dead = true;
        a.dead = true;
        score += POINTS[ a.size ];
        explode( a.x, a.y, a.size * 5 );
        newAsteroids.push( ...a.split() );
        if ( !powerUpSpawned ) {
          killsSinceSpawn++;
          const guaranteed = killsSinceSpawn >= 5;
          if ( guaranteed || Math.random() < POWERUP_DROP_CHANCE ) {
            powerUps.push( new PowerUp( a.x, a.y ) );
            powerUpSpawned = true;
          }
        }
      }
    }
  }
  asteroids = asteroids.filter( a => !a.dead ).concat( newAsteroids );
  bullets = bullets.filter( b => !b.dead );

  // Nave vs asteroide
  if ( ship.invincible <= 0 ) {
    for ( const a of asteroids ) {
      if ( dist( ship, a ) < ship.radius + a.radius * 0.82 ) {
        killShip();
        break;
      }
    }
  }

  // Nivel completado
  if ( asteroids.length === 0 ) nextLevel();
}

// ── Draw ──────────────────────────────────────────────────────────────────────
// El portal ya muestra puntuación, vidas y nivel fuera del iframe:
// aquí solo queda el contador del power-up.
function drawHUD() {
  if ( ship.tripleShot > 0 ) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `bold 15px ${ FONT }`;
    ctx.fillStyle = MAGENTA;
    glow( MAGENTA, 10 );
    ctx.fillText( `3x  ${ ship.tripleShot.toFixed( 1 ) }s`, 14, 26 );
    noGlow();
  }
}

function drawOverlay( title, sub, color = YELLOW ) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  glow( color, 16 );
  ctx.font = `bold 46px ${ FONT }`;
  ctx.fillText( title, W / 2, H / 2 - 88 );   // por encima de la nave, que reaparece en el centro
  noGlow();
  ctx.font = `18px ${ FONT }`;
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText( sub, W / 2, H / 2 - 48 );
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect( 0, 0, W, H );

  particles.forEach( p => p.draw() );
  asteroids.forEach( a => a.draw() );
  powerUps.forEach( p => p.draw() );
  bullets.forEach( b => b.draw() );
  ship.draw();

  drawHUD();

  if ( state === 'ready' )
    drawOverlay( 'ROCAS', 'PULSA ESPACIO PARA EMPEZAR' );

  if ( state === 'gameover' )
    drawOverlay( 'GAME OVER', `PUNTAJE: ${ score }`, MAGENTA );
}

// ── Loop principal ────────────────────────────────────────────────────────────
let lastTime = null;

function loop( ts ) {
  const dt = lastTime === null ? 0 : Math.min( ( ts - lastTime ) / 1000, 0.05 );
  lastTime = ts;
  if ( !paused ) update( dt );
  sendState();
  draw();
  requestAnimationFrame( loop );
}

initGame();
requestAnimationFrame( loop );
</script>
</body>
</html>
